name: Looopr
options:
  bundleIdPrefix: nl.astrontech
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.0.0"
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios-spm
    from: "5.0.0"
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa
    from: "9.0.0"
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: "9.0.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    DEVELOPMENT_TEAM: 8U8ACC3N8B
    # Deliberately OFF: the XcodeGen pre-build script rewrites the project
    # file and Info.plist, which the script sandbox forbids. Do not accept
    # Xcode's "recommended settings" suggestion to enable this.
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"

targets:
  Looopr:
    type: application
    platform: iOS
    sources:
      - path: Looopr
        excludes:
          - "Inactive/**"
          - "website/**"
      # Shared with the LoooprLiveActivity widget extension so the main app
      # can reference the Activity<WalkActivityAttributes> type when starting
      # and updating the Live Activity from LiveActivityManager.
      - path: LoooprLiveActivity/WalkActivityAttributes.swift
    configFiles:
      Debug: Looopr/Secrets.xcconfig
      Release: Looopr/Secrets.xcconfig
    info:
      path: Looopr/Info.plist
      properties:
        CFBundleDisplayName: Looopr
        # Pinned to the build settings so every XcodeGen version emits the
        # variables, never literals. A literal here ships every upload as
        # build "1" regardless of CURRENT_PROJECT_VERSION.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Looopr uses only HTTPS and Apple's own crypto, so it qualifies for the
        # exemption. Declaring it here stops App Store Connect asking the export
        # compliance question on every single upload.
        ITSAppUsesNonExemptEncryption: false
        # Settings > Privacy & Data > Export My Data writes a JSON file to the
        # app's Documents directory. These two keys make that directory show
        # up in the Files app (On My iPhone > Looopr); without them the file
        # is written but invisible to the user.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LoooprLogo
        NSLocationWhenInUseUsageDescription: "Looopr needs your location to generate walking routes nearby, and to record the route you actually walk while a walk is in progress."
        NSMotionUsageDescription: "Looopr counts your steps during walks to show your activity."
        NSHealthUpdateUsageDescription: "Looopr saves your completed walks to Apple Health as walking workouts, with the distance and the route you walked."
        NSHealthShareUsageDescription: "Looopr only writes walks to Apple Health and never reads your health data."
        # Keeps GPS recording alive while the phone is locked or Looopr is in
        # the background — without this the walked track stops the moment the
        # user pockets their phone.
        UIBackgroundModes:
          - location
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        CFBundleURLTypes:
          - CFBundleURLName: nl.astrontech.looopr
            CFBundleURLSchemes:
              - looopr
          # Native Google Sign-In returns to the app on its reversed client ID.
          - CFBundleURLName: google-sign-in
            CFBundleURLSchemes:
              - $(GOOGLE_IOS_REVERSED_CLIENT_ID)
        # Native Google Sign-In client IDs (Secrets.xcconfig). Empty iOS prefix =
        # fall back to Supabase web OAuth (which shows the supabase.co address).
        GOOGLE_IOS_CLIENT_ID: $(GOOGLE_IOS_CLIENT_ID)
        GOOGLE_PLACES_API_KEY: $(GOOGLE_PLACES_API_KEY)
        MAPBOX_ACCESS_TOKEN: $(MAPBOX_ACCESS_TOKEN)
        SUPABASE_URL: $(SUPABASE_URL)
        SUPABASE_ANON_KEY: $(SUPABASE_ANON_KEY)
        REVENUECAT_API_KEY: $(REVENUECAT_API_KEY)
        SENTRY_DSN: $(SENTRY_DSN)
        VIATOR_API_KEY: $(VIATOR_API_KEY)
        GETYOURGUIDE_API_KEY: $(GETYOURGUIDE_API_KEY)
        TIQETS_API_KEY: $(TIQETS_API_KEY)
        MUSEMENT_API_KEY: $(MUSEMENT_API_KEY)
        KLOOK_API_KEY: $(KLOOK_API_KEY)
    preBuildScripts:
      - name: "XcodeGen — sync project.yml"
        script: |
          # Xcode runs scripts with a minimal PATH; add Homebrew (Apple Silicon + Intel).
          export PATH="$PATH:/opt/homebrew/bin:/usr/local/bin"
          # Only regenerate when project.yml changed since the last generation.
          # Rewriting project.pbxproj in the middle of an Xcode (GUI) build makes
          # Xcode reload the project and cancel the build ("Build Canceled").
          if [ ! "$SRCROOT/project.yml" -nt "$SRCROOT/Looopr.xcodeproj/project.pbxproj" ]; then
            exit 0
          fi
          if which xcodegen > /dev/null 2>&1; then
            cd "$SRCROOT" && xcodegen generate --quiet
          else
            echo "warning: xcodegen not found — run: brew install xcodegen"
          fi
        basedOnDependencyAnalysis: false
    postBuildScripts:
      # Uploads dSYMs to Sentry so crashes are symbolicated. Only runs for
      # Release (archives) and only when sentry-cli + .sentryclirc exist,
      # so a fresh checkout still builds without any Sentry setup.
      - name: "Sentry — upload dSYMs"
        script: |
          if [ "$CONFIGURATION" != "Release" ]; then exit 0; fi
          # Xcode runs scripts with a minimal PATH; add Homebrew (Apple Silicon + Intel).
          export PATH="$PATH:/opt/homebrew/bin:/usr/local/bin"
          if [ ! -f "$SRCROOT/.sentryclirc" ]; then echo "note: no .sentryclirc — skipping Sentry dSYM upload"; exit 0; fi
          if ! which sentry-cli > /dev/null 2>&1; then echo "warning: sentry-cli not found — run: brew install getsentry/tools/sentry-cli"; exit 0; fi
          # A failed upload (e.g. offline) must not fail the archive.
          cd "$SRCROOT" && sentry-cli debug-files upload --include-sources "$DWARF_DSYM_FOLDER_PATH" || echo "warning: Sentry dSYM upload failed — upload manually with sentry-cli debug-files upload"
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.astrontech.looopr
        CODE_SIGN_ENTITLEMENTS: Looopr/Looopr.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.2"
        CURRENT_PROJECT_VERSION: "13"
        TARGETED_DEVICE_FAMILY: "1"
        GOOGLE_PLACES_API_KEY: $(GOOGLE_PLACES_API_KEY)
        MAPBOX_ACCESS_TOKEN: $(MAPBOX_ACCESS_TOKEN)
    dependencies:
      - package: Supabase
      - package: RevenueCat
        product: RevenueCat
      - package: RevenueCat
        product: RevenueCatUI
      - package: Sentry
        product: Sentry
      - package: GoogleSignIn
        product: GoogleSignIn
      - target: LoooprLiveActivity
        embed: true

  LoooprLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: LoooprLiveActivity
    info:
      path: LoooprLiveActivity/Info.plist
      properties:
        CFBundleDisplayName: LoooprLiveActivity
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.astrontech.looopr.LoooprLiveActivity
        MARKETING_VERSION: "1.2"
        CURRENT_PROJECT_VERSION: "13"
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES

  LoooprTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - LoooprTests
    dependencies:
      - target: Looopr
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.astrontech.looopr.tests
        GENERATE_INFOPLIST_FILE: true
        TARGETED_DEVICE_FAMILY: "1"
